[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proofforge"
version = "0.1.0"
description = "ProofForge: GRPO training with binary verification for theorem proving and code generation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
training = [
    "torch>=2.0",
    "transformers>=4.35",
    "peft>=0.7",
    "accelerate>=0.25",
    "datasets>=2.14",
]
analysis = [
    "scipy>=1.11",
    "matplotlib>=3.7",
]
sweep = [
    "gpytorch>=1.11",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "torch>=2.0",
]
full = [
    "proofforge[training,analysis,sweep]",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["proofforge*"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
