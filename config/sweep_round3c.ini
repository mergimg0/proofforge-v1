# ProofForge Round 3c Hyperparameter Sweep Configuration
#
# Uses Protein GP-based optimization to search over the key
# hyperparameters identified by OT-4C/4D audit.
#
# Usage:
#   python3 scripts/sweep_round3c.py --config config/sweep_round3c.ini
#
# Sweep spaces adapted from PufferLib default.ini format.

[sweep]
method = Protein
metric = pass_rate
metric_distribution = linear
goal = maximize
max_suggestion_cost = 7200
max_runs = 100
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.3

[sweep.learning_rate]
distribution = log_normal
min = 1e-7
max = 1e-4
scale = 0.5

[sweep.group_size]
distribution = uniform_pow2
min = 4
max = 64
scale = 0.5

[sweep.efficiency_phase_in_step]
distribution = int_uniform
min = 20
max = 100
scale = 0.5

[sweep.efficiency_phase_in_rate]
distribution = uniform
min = 0.10
max = 0.40
scale = 0.5

[sweep.controller_bias_correction]
distribution = uniform
min = 0.0
max = 0.30
scale = 0.5

[sweep.alpha_mastered]
distribution = uniform
min = 0.2
max = 0.8
scale = 0.5

[sweep.max_new_tokens]
distribution = uniform_pow2
min = 64
max = 512
scale = 0.5

[sweep.beta_rank]
distribution = uniform
min = 0.05
max = 0.50
scale = 0.5
