[workspace]
resolver = "2"
members = [
    "crates/pf-core",
    "crates/pf-lean",
    "crates/pf-pipeline",
    "crates/pf-agents",
    "crates/pf-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Mergim Gashi <mergim000gashi@gmail.com>"]
license = "MIT"
description = "ProofForge: LLM proof generation trained via GRPO with Lean 4 type checker as reward oracle"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
